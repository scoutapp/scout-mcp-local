name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: scoutapp/scout-mcp-local

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync

    - name: Run checks
      run: uv run task check

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.SCOUTAPP_DOCKER_USERNAME }}
        password: ${{ secrets.SCOUTAPP_DOCKER_PAT }}


    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=match,pattern=v(.*),group=1
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          io.modelcontextprotocol.server.name=com.scoutapm/scout-mcp-local

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  publish-python:
    name: Publish Python Package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: pypa/gh-action-pypi-publish@release/v1

  publish-registry:
    name: Publish to MCP Registry
    needs: [build-and-push, publish-python]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install mcp-publisher
      run: |
        curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

    - name: Log in to the MCP Registry
      env:
        MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
      run: ./mcp-publisher login dns --domain scoutapm.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"

    # server.json (local server) is bumped every release; server.remote.json
    # (hosted server) only when its metadata changes. Skip versions the
    # registry already has, since a version can't be republished.
    - name: Publish registry entries
      run: |
        for file in server.json server.remote.json; do
          name=$(jq -r .name "$file")
          version=$(jq -r .version "$file")
          encoded=$(jq -rn --arg n "$name" '$n|@uri')
          if curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0/servers/${encoded}/versions/${version}"; then
            echo "${name} ${version} is already published, skipping"
          else
            ./mcp-publisher publish "$file"
          fi
        done
