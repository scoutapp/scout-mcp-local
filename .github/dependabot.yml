version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-deps:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/wizard"
    schedule:
      interval: "monthly"
    groups:
      wizard-security:
        applies-to: security-updates
        patterns: ["*"]
      wizard-deps:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
